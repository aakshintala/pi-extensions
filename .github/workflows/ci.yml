name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find # parity with Pi's built-in grep and find
      - run: npm ci
      - run: npm test
      - run: npm run audit
      - run: npm run provenance
